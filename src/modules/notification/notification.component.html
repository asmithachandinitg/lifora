<div class="notif-wrap">

  <!-- Bell Button -->
  <button class="notif-btn" (click)="toggle()" [class.has-unread]="notifService.unreadCount > 0">
    <span class="material-icons">notifications_none</span>
    <span class="badge" *ngIf="notifService.unreadCount > 0">
      {{ notifService.unreadCount > 9 ? '9+' : notifService.unreadCount }}
    </span>
  </button>

  <!-- Dropdown Panel -->
  <div class="notif-panel" *ngIf="open">

    <!-- Header -->
    <div class="panel-header">
      <span class="panel-title">
        Notifications
        <span class="panel-count" *ngIf="notifService.unreadCount > 0">{{ notifService.unreadCount }}</span>
      </span>
      <div class="panel-actions">
        <button class="action-link" (click)="markAllRead()" *ngIf="notifService.unreadCount > 0">
          Mark all read
        </button>
        <button class="action-link danger" (click)="clearAll()" *ngIf="notifService.all.length > 0">
          Clear all
        </button>
      </div>
    </div>

    <!-- Empty state -->
    <div class="notif-empty" *ngIf="notifService.all.length === 0">
      <span class="material-icons">check_circle</span>
      <p>All caught up!</p>
    </div>

    <!-- Notification list -->
    <div class="notif-list" *ngIf="notifService.all.length > 0">
      <div
        class="notif-item"
        *ngFor="let n of notifService.all"
        [class.unread]="!n.read"
        (click)="navigate(n)">

        <!-- Icon -->
        <div class="notif-icon" [style.background]="n.iconColor + '18'" [style.color]="n.iconColor">
          <span class="material-icons">{{ n.icon }}</span>
        </div>

        <!-- Content -->
        <div class="notif-content">
          <div class="notif-module">{{ n.module }}</div>
          <div class="notif-title">{{ n.title }}</div>
          <div class="notif-body">{{ n.body }}</div>
        </div>

        <!-- Dismiss -->
        <button class="dismiss-btn" (click)="dismiss($event, n.id)">
          <span class="material-icons">close</span>
        </button>

        <!-- Unread dot -->
        <span class="unread-dot" *ngIf="!n.read"></span>

      </div>
    </div>

  </div>

</div>
