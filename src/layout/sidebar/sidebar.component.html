<div class="sidebar">

  <!-- Logo -->
  <div class="logo-section">
    <div class="logo">
      <div class="logo-icon-wrap">
      <img src="lifora-logo.svg" alt="Lifora" style="width:32px; height:32px; object-fit:contain;">
      </div>


      <div class="logo-text-wrap">
        <span class="logo-text">Lifora</span>
        <span class="logo-tagline">Your life, organised</span>
      </div>
    </div>
  </div>

  <!-- Grouped Menu -->
  <nav class="menu">

    <div class="menu-group" *ngFor="let group of menuGroups">

      <!-- Group Header -->
      <div class="group-header" (click)="toggleGroup(group)">
        <div class="group-header-left">
          <span class="material-icons group-icon">{{ group.icon }}</span>
          <span class="group-label">{{ group.group }}</span>
        </div>
        <span class="material-icons chevron" [class.rotated]="group.collapsed">
          expand_more
        </span>
      </div>

      <!-- Group Items -->
      <div class="group-items" [class.collapsed]="group.collapsed">
        <a
          *ngFor="let item of group.items"
          [routerLink]="item.route"
          routerLinkActive="active"
          class="menu-item">
          <span class="material-icons icon">{{ item.icon }}</span>
          <span class="label">{{ item.name }}</span>
        </a>
      </div>

    </div>

  </nav>

  <!-- Footer -->
  <div class="sidebar-footer">
    <span class="sidebar-version">LIFORA v1.0</span>
  </div>

</div>
