<div class="topbar">

  <!-- Left: Greeting + Date -->
  <div class="left">
    <div class="greeting">
      {{ getGreeting() }}, {{ user?.firstName | titlecase }} 👋
    </div>
    <div class="date">{{ today | date:'EEEE, MMMM d' }}</div>
  </div>

  <!-- Right: Actions + Avatar -->
  <div class="right">

    <!-- Notifications -->
    <!-- <button class="icon-btn">
      <span class="material-icons">notifications_none</span>
    </button> -->
<app-notification></app-notification>

    <!-- Avatar + Dropdown -->
    <div class="avatar-wrapper" (click)="toggleMenu()">

     <div class="avatar">
    <img *ngIf="user?.profilePhoto" 
         [src]="user.profilePhoto" 
         alt="avatar"
         style="width:100%; height:100%; object-fit:cover; border-radius:12px;">
    <span *ngIf="!user?.profilePhoto && avatarInitials" 
          style="font-size:15px; font-weight:700; color:white">
      {{ avatarInitials }}
    </span>
    <span *ngIf="!user?.profilePhoto && !avatarInitials" 
          class="material-icons">account_circle</span>
  </div>

      <span class="status-dot"></span>

      <!-- Dropdown -->
      <div class="dropdown" *ngIf="menuOpen">

        <div class="dropdown-item" (click)="goProfile()">
          <span class="material-icons item-icon">person_outline</span>
          Profile
        </div>

        <div class="dropdown-item" (click)="goSettings()">
          <span class="material-icons item-icon">settings</span>
          Settings
        </div>

        <div class="dropdown-divider"></div>

        <div class="dropdown-item danger" (click)="confirmLogout()">
          <span class="material-icons item-icon">logout</span>
          Logout
        </div>

      </div>

    </div>

  </div>

</div>

<!-- Logout Modal -->
<div class="logout-overlay" *ngIf="showLogoutModal" (click)="cancelLogout()">
  <div class="logout-modal" (click)="$event.stopPropagation()">
    <div class="logout-icon">👋</div>
    <h3>Leaving so soon?</h3>
    <p>Are you sure you want to logout?</p>
    <div class="logout-actions">
      <button class="btn-cancel" (click)="cancelLogout()">Stay</button>
      <button class="btn-confirm" (click)="logout()">Logout</button>
    </div>
  </div>
</div>
