<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="p1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ff8e53"/>
    </linearGradient>
    <linearGradient id="p2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd93d"/>
      <stop offset="100%" stop-color="#ff9f43"/>
    </linearGradient>
    <linearGradient id="p3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6bcb77"/>
      <stop offset="100%" stop-color="#4ecdc4"/>
    </linearGradient>
    <linearGradient id="p4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4d96ff"/>
      <stop offset="100%" stop-color="#45b7d1"/>
    </linearGradient>
    <linearGradient id="p5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c77dff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="p6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6fd8"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <radialGradient id="centerglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="50%" stop-color="#ffd93d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.10)"/>
    </filter>
    <filter id="petalshadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.12)"/>
    </filter>
  </defs>

  <!-- White background circle -->
  <circle cx="100" cy="100" r="100" fill="white"/>

  <!-- Outer subtle ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#f0f0f0" stroke-width="1"/>

  <!-- 6 petals -->
  <g filter="url(#petalshadow)">
    <g transform="translate(100,100) rotate(0)">
      <ellipse cx="0" cy="-44" rx="13" ry="26" fill="url(#p1)" opacity="0.95"/>
    </g>
    <g transform="translate(100,100) rotate(60)">
      <ellipse cx="0" cy="-44" rx="13" ry="26" fill="url(#p2)" opacity="0.95"/>
    </g>
    <g transform="translate(100,100) rotate(120)">
      <ellipse cx="0" cy="-44" rx="13" ry="26" fill="url(#p3)" opacity="0.95"/>
    </g>
    <g transform="translate(100,100) rotate(180)">
      <ellipse cx="0" cy="-44" rx="13" ry="26" fill="url(#p4)" opacity="0.95"/>
    </g>
    <g transform="translate(100,100) rotate(240)">
      <ellipse cx="0" cy="-44" rx="13" ry="26" fill="url(#p5)" opacity="0.95"/>
    </g>
    <g transform="translate(100,100) rotate(300)">
      <ellipse cx="0" cy="-44" rx="13" ry="26" fill="url(#p6)" opacity="0.95"/>
    </g>
  </g>

  <!-- Inner glow ring -->
  <circle cx="100" cy="100" r="22" fill="url(#centerglow)" opacity="0.9"/>

  <!-- Center white circle -->
  <circle cx="100" cy="100" r="10" fill="white" filter="url(#shadow)"/>

  <!-- Center dot -->
  <circle cx="100" cy="100" r="5" fill="url(#p1)"/>

  <!-- Sparkle dots between petals -->
  <circle cx="100" cy="67"  r="3" fill="white" stroke="#ff6b6b" stroke-width="1.5" opacity="0.9"/>
  <circle cx="128" cy="83"  r="3" fill="white" stroke="#ffd93d" stroke-width="1.5" opacity="0.9"/>
  <circle cx="128" cy="117" r="3" fill="white" stroke="#6bcb77" stroke-width="1.5" opacity="0.9"/>
  <circle cx="100" cy="133" r="3" fill="white" stroke="#4d96ff" stroke-width="1.5" opacity="0.9"/>
  <circle cx="72"  cy="117" r="3" fill="white" stroke="#c77dff" stroke-width="1.5" opacity="0.9"/>
  <circle cx="72"  cy="83"  r="3" fill="white" stroke="#ff6fd8" stroke-width="1.5" opacity="0.9"/>
</svg>
